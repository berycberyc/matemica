<script>

  var a = document.getElementById("app");
  if (a) a.innerHTML = '<div class="card"><div class="stem">Страница не запустилась.</div>' +
    '<div class="tech">' + msg + '<br>' + String(src).split("/").pop() + ', строка ' + line + ':' + col + '</div></div>';
};
</script>
