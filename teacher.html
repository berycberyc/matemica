<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>matemica — преподаватель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script>
window.onerror = function (msg, src, line, col) {
  var a = document.getElementById("app");
  if (a) a.innerHTML = '<div class="card"><div class="stem">Страница не запустилась.</div>' +
    '<div class="tech">' + msg + '<br>' + String(src).split("/").pop() + ', строка ' + line + ':' + col + '</div></div>';
};
window.addEventListener("unhandledrejection", function (e) {
  var a = document.getElementById("app");
  if (a && !a.textContent.trim()) a.innerHTML =
    '<div class="card"><div class="stem">Запрос к базе не прошёл.</div>' +
    '<div class="tech">' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div></div>';
});
</script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="teacher.js"></script>
</body>
</html>
